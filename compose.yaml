services:
  orchestrator:
    build:
      context: ./orchestrator
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SOURCE_REPOSITORY: /repository
      WORKSPACE_ROOT: /runtime/workspaces
      STATE_PATH: /runtime/data/state.json
      DISCORD_AVATAR_PATH: /app/assets/developer-avatar.png
      DISCORD_ARCHITECT_AVATAR_PATH: /app/assets/personas/aki-architect.png
      DISCORD_DESIGNER_AVATAR_PATH: /app/assets/personas/pixie-designer.png
      DISCORD_REVIEWER_AVATAR_PATH: /app/assets/personas/sentinel-reviewer.png
      AWS_DEPLOY_ENABLED: "false"
    volumes:
      - ./:/repository:ro
      - orchestrator-runtime:/runtime
      - ${HOME}/.codex:/home/node/.codex:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g

volumes:
  orchestrator-runtime:

